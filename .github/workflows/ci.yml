name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, version-independent gates run first so failures surface immediately.
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + lint tools
        run: pip install -e . ruff mypy
      - name: Ruff
        run: ruff check tokenopt tests
      - name: Mypy
        run: mypy tokenopt

  # Test gates across the supported Python matrix (DoD gate 1 + coverage gate).
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Pytest with coverage gate (>=80%)
        run: pytest tests/ -q

  # DoD gates 4-5: build the distributions and smoke-test the wheel in a fresh venv.
  package:
    name: Package (build + fresh-venv smoke)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tool
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Fresh venv install + import smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import tokenopt; print('smoke ok:', tokenopt.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenopt-dist
          path: dist/
          retention-days: 7
