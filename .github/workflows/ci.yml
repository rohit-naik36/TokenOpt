name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, version-independent gates run first so failures surface immediately.
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + lint tools
        run: pip install -e . ruff mypy
      - name: Ruff
        run: ruff check tokenopt tests
      - name: Mypy
        run: mypy tokenopt

  # Test gates across the supported Python matrix (DoD gate 1 + coverage gate).
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Pytest with coverage gate (>=80%)
        run: pytest tests/ -q

  # DoD gates 4-5: build the distributions and smoke-test the wheel in a fresh venv.
  package:
    name: Package (build + fresh-venv smoke)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tool
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine metadata check (DoD gate 5)
        run: |
          pip install twine
          twine check dist/*
      - name: Fresh venv install + import smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import tokenopt; print('smoke ok:', tokenopt.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: tokenopt-dist
          path: dist/
          retention-days: 7

  # Security baseline (M7): dependency vulnerability scan + secret scan.
  security:
    name: Security (pip-audit + gitleaks)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + pip-audit
        run: pip install -e ".[dev]"
      # Audits the runtime dependency set (resolved from pyproject.toml).
      # Fails on any finding in the OSV advisory database.
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --path . --desc
      # Pinned release, full history; fails on any leaked secret.
      - name: gitleaks (secret scan)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          ./gitleaks detect --source . --no-banner --log-opts=--all
