name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + Publish v0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tool
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine metadata check
        run: twine check dist/*
      # Trusted Publishing (OIDC): no secrets stored; the PyPI Trusted
      # Publisher must be configured for project "tokenopt" / owner
      # "rohit-naik36" / workflow "publish.yml" / tag "v*" (Decision 26).
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: dist/
