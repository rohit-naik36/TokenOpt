# Dependabot configuration

version: 2
updates:
  # Python package dependencies (runtime + optional extras).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # numpy>=2.5 requires Python>=3.12 and ships PEP 695 stubs mypy cannot
      # parse under python_version=3.10 — keep Dependabot below that ceiling.
      - dependency-name: "numpy"
        versions: [">=2.5"]

  # GitHub Actions used in CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
