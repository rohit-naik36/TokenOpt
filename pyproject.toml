[project]
name = "tokenopt"
version = "0.1.0"
description = "Drop-in token & prompt optimization for OpenAI, Anthropic, and local LLM clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rohit Naik" }]
keywords = [
    "llm", "openai", "anthropic", "ollama", "prompt", "optimization",
    "compression", "caching", "routing", "summarization", "rag", "few-shot",
    "cost", "latency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # numpy<2.5: 2.5 requires Python>=3.12 (declared floor is 3.10) and its
    # .pyi stubs use PEP 695 syntax mypy cannot parse under python_version=3.10
    "numpy>=1.24,<2.5",
]

[project.urls]
Homepage = "https://github.com/rohit-naik36/TokenOpt"
Repository = "https://github.com/rohit-naik36/TokenOpt"
Issues = "https://github.com/rohit-naik36/TokenOpt/issues"
Documentation = "https://github.com/rohit-naik36/TokenOpt#readme"
CI = "https://github.com/rohit-naik36/TokenOpt/actions"

[project.optional-dependencies]
cache = ["redis>=5.0.0"]
semantic = ["sentence-transformers>=3.0.0"]
compression = ["llmlingua>=0.1.0"]
local = ["ollama>=0.3.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.0.0", "ruff>=0.3.0", "mypy>=1.0.0", "pip-audit>=2.7.0", "httpx>=0.24.0"]
all = ["redis>=5.0.0", "sentence-transformers>=3.0.0", "llmlingua>=0.1.0", "ollama>=0.3.0"]

[build-system]
# setuptools>=77 required for PEP 639 SPDX license metadata (`license = "MIT"`)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "tokenopt",
    "tokenopt.clients",
    "tokenopt.pipeline",
    "tokenopt.observability",
    "tokenopt.utils",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Optional extras are imported fail-open (try/except); type gate must not
# require installing heavy optional dependencies (redis, llmlingua, ST,
# ollama).
[[tool.mypy.overrides]]
module = ["redis.*", "llmlingua.*", "sentence_transformers.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tokenopt --cov-report=term-missing"

[tool.coverage]
fail_under = 80