[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenopt-optimizer"
version = "0.1.0"
description = "Standalone, embeddable prompt-optimization engine with fidelity validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - see LICENSE (TBD) before commercial distribution" }
keywords = ["llm", "prompt", "optimization", "tokens", "fidelity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
headroom = ["headroom>=0.3.0"]

[tool.setuptools]
packages = ["tokenopt_optimizer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
